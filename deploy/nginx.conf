# Reverse proxy for Jewelry AI Analytics (prod).
# Place TLS certs in deploy/certs/fullchain.pem and deploy/certs/privkey.pem
# or switch to HTTP-only for staging by commenting the HTTPS server block.

upstream kz_api {
    server api:8000;
}

upstream kz_frontend {
    server frontend:80;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 15m;

    location /api/ {
        proxy_pass http://kz_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /docs {
        proxy_pass http://kz_api;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://kz_api;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://kz_frontend;
        proxy_set_header Host $host;
    }
}
