# Production-oriented compose (no bind mounts, no reload).
# Usage:
#   cp .env.example .env.prod   # fill secrets; APP_ENV=production; SYNC_ENABLED=true
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kz_ai}
      POSTGRES_USER: ${POSTGRES_USER:-kz_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./backend
    env_file:
      - ${ENV_FILE:-.env.prod}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kz_ai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kz_ai}
      REDIS_URL: redis://redis:6379/0
      APP_ENV: production
    volumes:
      - uploads_prod:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    restart: unless-stopped
    expose:
      - "8000"

  worker:
    build:
      context: ./backend
    env_file:
      - ${ENV_FILE:-.env.prod}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kz_ai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kz_ai}
      REDIS_URL: redis://redis:6379/0
      APP_ENV: production
    volumes:
      - uploads_prod:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app worker -B -l info
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    depends_on:
      - api
    restart: unless-stopped
    expose:
      - "80"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - frontend
    restart: unless-stopped

volumes:
  pgdata_prod:
  uploads_prod:
