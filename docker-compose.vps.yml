# Small VPS overlay: one API worker, same-origin frontend, self-signed TLS.
#   docker compose -f docker-compose.prod.yml -f docker-compose.vps.yml --env-file .env.prod up -d --build

services:
  api:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ""

  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.vps.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
